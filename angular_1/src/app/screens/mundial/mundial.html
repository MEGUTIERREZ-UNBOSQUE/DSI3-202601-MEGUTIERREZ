<h1>bienvenido a el mundial</h1>

<label>Cantidad de partidos (1-100)</label>
<input type="number" [(ngModel)]="cantidad" min="1" max="100" />
<button (click)="generarPartidos()">Calcular</button>

@if (partidos.length > 0) {

  @for (partido of partidos; track $index) {
    <div>
      <strong>Partido #{{ $index + 1 }}</strong>
      <label>🇨🇴 Colombia</label>
      <input type="number" [(ngModel)]="partidos[$index].colombiaGoles" min="0" />
      <label>🇫🇷 Francia</label>
      <input type="number" [(ngModel)]="partidos[$index].franciaGoles" min="0" />
    </div>
  }

  <button (click)="calcularGanador()">Ver ganador</button>

  @if (ganador !== '') {
    <h2>Ganador: {{ ganador }}</h2>
  }

}
