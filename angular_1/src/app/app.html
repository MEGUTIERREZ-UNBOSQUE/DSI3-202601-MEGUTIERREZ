<button (click)="changeOptions(1)">juego</button>
<button (click)="changeOptions(2)">mundial</button> 
<button (click)="changeOptions(0)">Clear</button>
@switch (this.options) {
  @case (1) {
<app-game></app-game>
  }
  @case (2) {
<app-mundial></app-mundial>    
  }
  @default {
  <p>Debe seleccionar una opcion </p> 

  }
}
