<section class="productos" id="productos">
  <div class="container">
    <div class="section-header">
      <span class="section-header__label">Nuestros Productos</span>
      <h2 class="section-header__title">Más que café, una experiencia</h2>
      <p class="section-header__subtitle">Un momento de pausa en medio del ritmo diario.</p>
    </div>

    <div class="productos__carousel">
      <div class="productos__carousel-row">
        <button class="productos__carousel-btn" (click)="prevSlide()" [disabled]="currentSlide === 0">←</button>
        
        <div class="productos__carousel-window">
          <div class="productos__carousel-track" [style.transform]="'translateX(-' + (currentSlide * 33.333) + '%)'">
            @for (product of products; track product.name) {
              <div class="productos__slide">
                <article class="product-card" [class.product-card--featured]="product.featured">
                  <div class="product-card__img">
                    <img [src]="product.image" [alt]="product.name" />
                  </div>
                  <div class="product-card__body">
                    <h4 class="product-card__title">{{ product.name }}</h4>
                    <p class="product-card__desc">{{ product.desc }}</p>
                    <span class="product-card__price">{{ product.price }}</span>
                  </div>
                </article>
              </div>
            }
          </div>
        </div>

        <button class="productos__carousel-btn" (click)="nextSlide()" [disabled]="currentSlide >= products.length - 3">→</button>
      </div>

      <div class="productos__carousel-dots">
        @for (dot of getDots(); track $index) {
          <button 
            class="productos__carousel-dot" 
            [class.productos__carousel-dot--active]="currentSlide === $index"
            (click)="goToSlide($index)">
          </button>
        }
      </div>
    </div>

    <div class="productos__cta">
      <a href="#" class="btn btn--outline btn--lg">Menú Completo</a>
    </div>
  </div>
</section>
