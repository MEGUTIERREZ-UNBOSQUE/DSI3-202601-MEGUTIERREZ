<header class="navbar" [class.scrolled]="isScrolled">
  <a href="#" class="navbar__logo">Café De La Maison</a>

  <nav class="navbar__nav" [class.is-open]="isMenuOpen">
    <a href="#historia" (click)="closeMenu()">Nuestra Historia</a>
    <a href="#productos" (click)="closeMenu()">Menú</a>
    <a href="#testimonios" (click)="closeMenu()">Testimonios</a>
    <a href="#contacto" (click)="closeMenu()">Contacto</a>
  </nav>

  <div class="navbar__actions">
    <div class="lang-switch">
      <button class="lang-switch__btn lang-switch__btn--active">ES</button>
      <span>|</span>
      <button class="lang-switch__btn">EN</button>
    </div>
    <button class="btn btn--outline">Ingreso</button>
    <a href="#reservar" class="btn btn--primary">Reservar</a>
  </div>

  <button class="navbar__hamburger" (click)="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>
