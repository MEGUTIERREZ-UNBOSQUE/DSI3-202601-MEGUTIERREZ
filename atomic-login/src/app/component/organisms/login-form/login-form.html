<div class="login-form">
  <app-login-header></app-login-header>

  <!-- Input Molecule -->
  <app-input-field-molecule
    label="Correo electrónico"
    fieldId="email"
    type="email"
    placeholder="usuario@email.com"
    [value]="email"
    [errorMsg]="emailError"
    (valueChange)="email = $event; emailError = ''"
  ></app-input-field-molecule>

  <!-- Input Molecule -->
  <app-input-field-molecule
    label="Contraseña"
    fieldId="password"
    type="password"
    placeholder="••••••••"
    [value]="password"
    [errorMsg]="passwordError"
    (valueChange)="password = $event; passwordError = ''"
  ></app-input-field-molecule>

  <!-- Login Actions -->
  <app-login-actions
    [loading]="loading"
    (onSubmit)="handleLogin()"
  ></app-login-actions>
</div>
