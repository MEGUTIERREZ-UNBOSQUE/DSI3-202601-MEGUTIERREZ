<div class="login-form">
  <app-login-header></app-login-header>

  <app-input-field-molecule
    label="Correo electrónico"
    fieldId="email"
    type="email"
    placeholder="usuario@email.com"
    [value]="email"
    [errorMsg]="emailError"
    (valueChange)="email = $event; emailError = ''"
  ></app-input-field-molecule>

  <app-input-field-molecule
    label="Contraseña"
    fieldId="password"
    type="password"
    placeholder="••••••••"
    [value]="password"
    [errorMsg]="passwordError"
    (valueChange)="password = $event; passwordError = ''"
  ></app-input-field-molecule>

  <app-login-actions
    [loading]="loading"
    (onSubmit)="handleLogin()"
  ></app-login-actions>

  <div class="login-form__register-link">
    ¿No tienes cuenta? 
    <span class="login-form__link" (click)="navigateToRegister()">Regístrate aquí</span>
  </div>
</div>
