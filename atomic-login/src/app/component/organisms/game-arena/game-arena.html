<div class="game-arena">
  <h1 class="game-arena__title">GAME ARENA</h1>
  <p class="game-arena__subtitle">Alice vs Bob</p>

  <div class="game-arena__form">
    <label class="game-arena__label">CANTIDAD DE PARTIDOS</label>
    <input 
      class="game-arena__input" 
      type="number" 
      [(ngModel)]="elements"
      min="1"
      placeholder="1"
    />
    <button class="game-arena__button" (click)="generateElements(elements)">
      GENERAR
    </button>
  </div>

  @if (elements > 0 && selections.length > 0) {
    <div class="game-arena__games">
      <h2 class="game-arena__games-title">PARTIDOS: {{ elements }}</h2>
      
      @for (item of selections; track $index) {
        <div class="game-arena__row">
          <span class="game-arena__row-label">JUEGO #{{ $index + 1 }}</span>
          <select 
            class="game-arena__select" 
            [(ngModel)]="selections[$index]">
            <option value="" disabled>SELECCIONE GANADOR</option>
            <option value="Alice">ALICE</option>
            <option value="Bob">BOB</option>
            <option value="Empate">EMPATE</option>
          </select>
        </div>
      }

      <button class="game-arena__button" (click)="calculateWinner()">
        CALCULAR GANADOR
      </button>

      @if (winner) {
        <div class="game-arena__winner">
          <span></span>
          <p>{{ winner }}</p>
        </div>
      }
    </div>
  } @else {
    <p class="game-arena__empty">Ingrese la cantidad de juegos para comenzar</p>
  }
</div>
