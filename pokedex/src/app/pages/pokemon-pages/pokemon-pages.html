<div class="layout">
  <div class="layout__detail">
    <app-pokemon-detail
      [pokemon]="selectedPokemon"
      (searched)="onSearch($event)"
    />
  </div>
  <div class="layout__grid">
    <app-pokemon-grid
      [pokemons]="pokemons"
      (selected)="onSelect($event)"
      (next)="onNext()"
      (prev)="onPrev()"
    />
  </div>
</div>
